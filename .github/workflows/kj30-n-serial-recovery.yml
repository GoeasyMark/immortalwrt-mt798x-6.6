name: KJ30-N serial recovery build

on:
  pull_request:
    paths:
      - "target/linux/mediatek/**"
      - ".github/workflows/kj30-n-serial-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-yaml \
            rsync unzip zlib1g-dev file wget
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure KJ30-N initramfs target
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_kjd_kj30-n=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          EOF
          make defconfig

      - name: Build
        run: make -j$(nproc) V=s

      - name: Publish RAM-boot image
        uses: actions/upload-artifact@v4
        with:
          name: kj30-n-serial-initramfs
          path: |
            bin/targets/mediatek/filogic/*kjd*initramfs.itb
          if-no-files-found: error
          retention-days: 14
